<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>휘모리잡가</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #2a2a2a; }
body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #F8F5F0; color: #1a1a1a; max-width: 390px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,.5); }

/* 헤더 */
.header { background: #8B2020; color: #fff; padding: 16px 20px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 700; }
.back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 0 4px; display: none; }

/* 목록 */
#list-screen { padding: 16px; }
.song-card { background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; cursor: pointer; border-left: 4px solid #8B2020; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.card-num { font-size: 11px; font-weight: 700; color: #fff; background: #8B2020; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-perf { font-size: 11px; color: #999; }
.song-card h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.song-card p { font-size: 13px; color: #666; line-height: 1.5; }

/* 상세 */
#detail-screen { display: none; }
.tabs { display: flex; border-bottom: 2px solid #e0d8cf; background: #fff; }
.tab { flex: 1; padding: 12px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer; color: #888; border: none; background: none; }
.tab.active { color: #8B2020; border-bottom: 2px solid #8B2020; margin-bottom: -2px; }
.tab-content { display: none; padding: 20px 16px; }
.tab-content.active { display: block; }

/* 원문 */
.text-block { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; font-size: 15px; line-height: 2; }
sup.fn { color: #8B2020; font-weight: 700; cursor: pointer; font-size: 11px; vertical-align: super; }

/* 해석 */
.interp-section { margin-bottom: 20px; }
.interp-section h3 { font-size: 14px; font-weight: 700; color: #8B2020; margin-bottom: 8px; }
.interp-section p { font-size: 14px; line-height: 1.9; color: #333; background: #fff; border-radius: 10px; padding: 14px; }
.interp-section blockquote { font-size: 13px; color: #555; line-height: 1.8; padding: 10px 14px; border-left: 3px solid #ccc; margin-bottom: 8px; background: #fafaf8; border-radius: 0 8px 8px 0; }

/* 각주 팝업 */
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; }
#note-sheet { display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 36px; z-index: 101; }
#note-sheet h4 { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #8B2020; }
#note-sheet p { font-size: 15px; line-height: 1.8; color: #333; }

/* 사이트맵 드로어 */
#sm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 199; }
#sitemap { position: fixed; top: 0; left: -260px; width: 240px; height: 100vh; background: #fff; z-index: 200; transition: left .25s ease; overflow-y: auto; }
#sitemap.open { left: 0; }
.sm-hd { background: #8B2020; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
.sm-hd span { font-size: 14px; font-weight: 700; }
.sm-hd button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; line-height: 1; }
.sm-perf { padding: 14px 16px 4px; font-size: 11px; color: #8B2020; font-weight: 700; letter-spacing: .06em; border-top: 1px solid #f0ebe4; margin-top: 4px; }
.sm-perf:first-of-type { border-top: none; margin-top: 0; }
.sm-item { display: flex; align-items: center; gap: 8px; padding: 9px 16px 9px 20px; font-size: 13px; color: #444; cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
.sm-item:hover { background: #f8f5f0; }
.sm-item.active { color: #8B2020; font-weight: 700; background: #fdf6f6; }
.sm-num { font-size: 11px; color: #aaa; min-width: 18px; }
.menu-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 0 4px; }
</style>
</head>
<body>

<div id="sm-overlay" onclick="toggleSitemap()"></div>
<div id="sitemap">
  <div class="sm-hd"><span>곡 목록</span><button onclick="toggleSitemap()">✕</button></div>
  <div id="sm-body"></div>
</div>

<div class="header">
  <button class="menu-btn" onclick="toggleSitemap()">☰</button>
  <button class="back-btn" id="backBtn" onclick="showList()">←</button>
  <h1 id="headerTitle">휘모리잡가</h1>
</div>

<div id="list-screen">
  <div id="songList"></div>
</div>

<div id="detail-screen">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('원문')">원문</button>
    <button class="tab" onclick="switchTab('해석')">해석</button>
  </div>
  <div id="tab-원문" class="tab-content active"></div>
  <div id="tab-해석" class="tab-content"></div>
</div>

<div id="overlay" onclick="closeNote()"></div>
<div id="note-sheet">
  <h4 id="note-word"></h4>
  <p id="note-def"></p>
</div>

  {
    title: '맹꽁이타령',
    desc: '다섯 마리씩 묶인 맹꽁이들의 황당한 에피소드 연속. 40마리 공회와 "누가 숫 맹꽁이인가"라는 질문으로 마무리',
    paras: [
      `저 건너 신진사<sup>1</sup> 집 시렁<sup>2</sup>위에 청동청정미 차좁쌀<sup>3</sup>이 씰어 까불어<sup>4</sup> 톡 제친 청동청정미 청차좁쌀이냐 아니 씰어 까불어 툭 제친 청동청정미 청차좁쌀이냐 아래 대 맹꽁이 다섯 우 대 맹꽁이 다섯`,
      `동수구문<sup>5</sup> 두 사이 오간수<sup>6</sup> 다리 밑에 울고 노던 맹꽁이가 오뉴월 장마에 떠내려오는 헌 나막신짝을 선유<sup>7</sup> 배만 여겨 순풍에 돛을 달고 명기명창 가객이며 갖은 풍류 질탕<sup>8</sup>하고 배반이 낭자<sup>9</sup>하여 선유하는 맹꽁이 다섯`,

      `삼청동 막바지 장원서<sup>18</sup> 다리 밑에 울고 놀던 맹꽁이가 마전꾼<sup>19</sup>의 점심 몰래 훔쳐먹다 빨래 망치로 얻어 맞고 해산 선머리를 질끈 동이고 가차운 병원으로 입원하러 가는 맹꽁이 다섯`,
      `경모궁<sup>20</sup> 안 연못 안에 울고 놀던 맹꽁이를 강감찰<sup>21</sup>이 함을 물려<sup>22</sup> 벙어리 되어 울지 못하고 연잎 뚝 따 물 담아 가지고 대굴대굴 굴려가며 수은 장사하는 맹꽁이 다섯`,
      `시집 간 지 이태 만에 시앗<sup>23</sup>을 보고 큰 애미 첩년이 쌈질을 하다 원당자<sup>24</sup>한테 꽁대를 맞고<sup>25</sup> 한숨 지어 하는 말이 에라 시집살이는 판 틀렸구나 치마끈을 졸라매고 반짓고리<sup>26</sup>를 뒤짊어지고 실 한바람 꽁무니에 차고 고추나무에 목 매러가며 통곡하는 맹꽁이 다섯`,

      `오팔사십 마흔 맹꽁이가 칠월이라 백중<sup>28</sup> 날 공회를 한다하고 모화관 반송<sup>29</sup> 승버들 가지 밑에 수북이 모여 울음 내리할 제 밑에 맹꽁이 웃 맹꽁일 쳐다보며 엣다 이놈 염치없이 너무 누르지 마라 무거우라고 맹꽁 위에 맹꽁이 아래 맹꽁이를 내려다 보며 엣다 이놈 차갑스럽게 군말 된다 참을성도 끔찍이도 없다 잠깐만 참으라고 맹꽁`,
      `그리로 숭례문 밖 썩 내달아 칠패팔패 이문동<sup>30</sup> 도적골 네거리 쪽다리 배다리 돌무루 끝을 썩 나서며 첫 둘 셋 넷 다섯 여섯 일곱 여덟 아홉 열째 미나리 논에 머리 풀어 산발하고 눈물 콧물 꼬조조 흘리고 방귀 뽕 뀌고 오줌 잘끔 싸고 두 다리를 퍼덕거리고 우는 맹꽁이 중에 어느 맹꽁이 숫 맹꽁이인가`,
      `그 중에 녹수청산 깊은 골에 백수풍신<sup>31</sup> 휘날린 점잖은 맹꽁이가 손자 맹꽁이를 무릎에 앉히고 저리 가거라 뒷태를 보자 이리 오너라 앞태를 보자 아장아장 걸어라 방끗 웃어라 잇속을 보자 백만교태를 다 부려라 도리도리 짝짝꿍<sup>32</sup> 곤지곤지 죄암죄암 길나라비 훨훨 재롱보는 맹꽁이가 숫 맹꽁인가`

  {
    title: '바위타령',
    desc: '임 없이 지은 밥에 돌이 많다는 한 줄에서 서울~평안도 바위 대열거가 폭발하고, 솥 안에서 해태가 기어다니는 결말',
    paras: [
      `배 고파 지어놓은 밥에 뉘도<sup>1</sup> 많고 돌도 많다 뉘 많고 돌 많기는 임이 안 계신 탓이로다 그 밥에 어떤 돌이 들었더냐`,
      `초벌로 새문안<sup>2</sup> 거지바위 문턱바위 둥글바위 너럭바위<sup>3</sup> 치마바위 감투바위 뱀바위 구렁바위 독사바위 행금바위<sup>4</sup> 중바위 동교로 북바위 갓바위 동소문 밖 덤바위 자하문<sup>5</sup> 밖 붙임바위<sup>6</sup> 백운대<sup>7</sup>로 결단바위 승가절<sup>8</sup> 쪽도리바위 용바위 신선바위<sup>9</sup> 부처바위 필운대<sup>10</sup>로 삿갓바위 남산은 꾀꼬리바위 범바위 궤바위 남문 밖 자암바위 우수재로 두텁바위 이태원 록바위 헌다리 땅바위 모화관 호랑바위 선바위 길마재<sup>11</sup>로 말목바위 감투바위 서호정 용바위 골바위 둥구재로 배꼽바위 말굽바위 밭바위 안바위 할미바위 숫돌바위 하마바위<sup>12</sup> 애오개<sup>13</sup>는 걸바위 너분바위 쌍룡정 거좌바위 봉학정 벼락바위 삼개<sup>14</sup>는 벙바위 고양도 벙바위`,
      `양천은 허바위 김포로 돌아 감바위 통진 붉은바위 인천은 석바위 시흥 운문산 누덕바위 형제바위 삼신바위 과천 관악산 염불암 연주대<sup>15</sup>로 세수바위 문바위 문턱바위 수원 한나루 영웅바위 돌정바위 검바위 광주는 서성바위 이천은 곤지바위 음죽바위 앉을바위 여주흔바위 양근는 독바위 황해도로 나려 금천은 실바위 연안 걸들바위 서흥 병풍바위 동설령 새남 찍꺽바위 과줄바위 황주는 쪽도리바위 평양감영 장경문안 쇠바위 덕바위 서문안의 안장바위 웃바위 순안은 실바위 숙천은 허바위라 도로 올라 한양 서울 경퇴절 법당앞에 괘대바위 서강의 농바위<sup>16</sup> 같은 돌맹이가 하얀 흰 밥에 청대콩 많이 까 두은 듯이 듬성이 박혔더라 그 밥을 건목을 치고<sup>17</sup> 이를 쑤시고 자세히 보니 연주문 돌기둥<sup>18</sup> 한쌍이 금니 박히 듯 박혔더라 그 밥을 다 먹고 나서 눌은 밥을 훑으려고 솥뚜껑 열고보니 해태<sup>19</sup> 한쌍이 엉금엉금`
    ],

  el.innerHTML = orderedSongs.map((s, i) => `
    <div class="song-card" onclick="showDetail(${i})">
      <div class="card-meta"><span class="card-num">${i + 1}</span><span class="card-perf">${s.performer}</span></div>
      <h2>${s.title}</h2>
      <p>${s.desc}</p>
    </div>
  `).join('');
}

function showDetail(i) {
  currentSong = orderedSongs[i];
  currentSongIdx = i;
  document.getElementById('headerTitle').textContent = currentSong.title;
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('list-screen').style.display = 'none';
  document.getElementById('detail-screen').style.display = 'block';
  switchTab('원문');
  renderSitemap();
  window.scrollTo(0, 0);
}

function showList() {
  currentSong = null;
  currentSongIdx = -1;
  document.getElementById('headerTitle').textContent = '휘모리잡가';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('list-screen').style.display = 'block';
  document.getElementById('detail-screen').style.display = 'none';
  renderSitemap();
  window.scrollTo(0, 0);
}

function toggleSitemap() {
  const sm = document.getElementById('sitemap');
  const ov = document.getElementById('sm-overlay');
  const isOpen = sm.classList.contains('open');
  sm.classList.toggle('open', !isOpen);
  ov.style.display = isOpen ? 'none' : 'block';
}

function renderSitemap() {
  let num = 0;
  const html = performers.map(p => {
    const items = p.idx.map(origIdx => {
      const songIdx = orderedSongs.findIndex(s => s.title === songs[origIdx].title);
      num++;
      const isActive = currentSongIdx === songIdx;
      return `<button class="sm-item${isActive ? ' active' : ''}" onclick="showDetail(${songIdx});toggleSitemap()"><span class="sm-num">${num}</span>${songs[origIdx].title}</button>`;
    }).join('');
    return `<div class="sm-perf">${p.name}</div>${items}`;
  }).join('');
  document.getElementById('sm-body').innerHTML = html;
}

function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event && event.target.classList.add('active');
  document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  renderTabContent(name);
}

function renderTabContent(name) {
  if (!currentSong) return;
  if (name === '원문') {
    const html = currentSong.paras.map(p => {
      const text = p.replace(/<sup>(\d+)<\/sup>/g, '<sup class="fn" data-note="$1" onclick="showNote(this)">$1</sup>');
      return `<div class="text-block">${text}</div>`;
    }).join('');
    document.getElementById('tab-원문').innerHTML = html;
  } else {
    const html = currentSong.interp.map(sec => `
      <div class="interp-section">
        <h3>${sec.h}</h3>
        ${sec.q ? `<blockquote>${sec.q}</blockquote>` : ''}
        <p>${sec.b}</p>
      </div>
    `).join('');
    document.getElementById('tab-해석').innerHTML = html;
  }
}

function showNote(el) {
  const n = el.dataset.note;
  const note = currentSong.notes[n];
  if (!note) return;
  document.getElementById('note-word').textContent = note[0];
  document.getElementById('note-def').textContent = note[1];
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('note-sheet').style.display = 'block';
}

function closeNote() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('note-sheet').style.display = 'none';
}

renderList();
renderSitemap();
</script>
</body>
</html>
